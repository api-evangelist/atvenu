      type: object
      properties:
        profile:
          type: object
          description: Profile object containing source, type, identifiers and optional attributes.
        profile.source:
          type: string
          description: Source of the profile, e.g. "acme".
        profile.type:
          type: string
          description: Type of the profile, e.g. "customer".
        profile.identifiers:
          type: array
          description: Array of identifier objects.
        profile.identifiers[].type:
          type: string
          description: Identifier type such as "email" or "phone_number".
        profile.identifiers[].value:
          type: string
          description: Identifier value.
        profile.attributes:
          type: object
