          description: Unique identifier of the profile.
        profile.user_id:
          type: string
          description: Zendesk user id associated with the profile.
        profile.source:
          type: string
        profile.type:
          type: string
        profile.name:
          type: string
        profile.attributes:
          type: object
        profile.identifiers:
          type: array
        profile.created_at:
          type: string
