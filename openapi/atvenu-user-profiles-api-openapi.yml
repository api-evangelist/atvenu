components:
  schemas:
    PatchApiV2UserProfilesRequest:
      type: object
      properties:
        profile:
          type: object
          description: Partial profile object with fields to be updated.
        profile.identifiers:
          type: array
          description: Array of identifier objects to add.
        profile.identifiers[].type:
          type: string
          description: Identifier type, e.g. "office_phone".
        profile.identifiers[].value:
          type: string
          description: Identifier value.
      required:
      - profile
      - profile.identifiers
      - profile.identifiers[].type
      - profile.identifiers[].value
    PostApiV2UserProfilesEventsRequest:
      type: object
      properties:
        profile:
          type: object
          description: Profile that associates the person with a Zendesk user
        event:
          type: object
          description: Event data to be recorded
      required:
      - profile
      - event
    PatchApiV2UserProfilesResponse:
      type: object
      properties:
        profile.id:
          type: string
        profile.user_id:
          type: string
        profile.source:
          type: string
        profile.type:
          type: string
        profile.name:
          type: string
        profile.attributes:
          type: object
        profile.identifiers:
          type: array
        profile.created_at:
          type: string
        profile.updated_at:
          type: string
    PostApiV2UserProfilesEventsResponse:
      type: object
      properties:
        status:
          type: string
          description: Indicates the event was received
    PutApiV2UserProfilesResponse:
      type: object
      properties:
        profile.id:
