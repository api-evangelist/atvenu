aid: atvenu

name: atVenu

image: https://cdn.prod.website-files.com/6971425127cb32a80d3a8915/6a3016250738cb3116eb4571_f05b49821ad326db4fbd8407918dec35_OpenGraph.png

description: atVenu provides an all‑in‑one payment and commerce platform for live events, enabling venues, festivals, artists, and pop‑up experiences
  to sell merchandise, food, beverage, tickets and services through a unified POS system. The solution supports mobile ordering, promotions, inventory
  management, and integrates with existing ticketing and CRM tools, aiming to streamline revenue streams for transient event operators.

